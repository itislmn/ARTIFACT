# computer_vision/config.toml - the one settings file (read with Python's own tomllib).
# Every program prints what the hardware actually delivered; report those values in the thesis.

session = "CV1"                  # recordings/<session>/ : radar takes, camera takes, logs of this measurement day

[camera]                         # ISY IW-1000-1 webcam, mounted on the AWR2944PEVM radar
name = "IW 1000-1"               # part of the DirectShow device name (python -m backend.camera --list); never an index
width = 1280                     # MJPG modes of the ISY, all 30 fps: 1280x720, 800x600, 640x480, 320x240
height = 720
clip_level = 250                 # luma >= this counts as clipped: 255 is the sensor maximum, the MJPG
                                 # compression smears clipped areas down to about 250
exposure = "auto"                # "auto" or log2(seconds), e.g. -7 = 1/128 s. Glare experiments: FIXED, chosen
                                 # so that the paper stays below clipping without the lamp (python -m backend.camera --exposure -7)

[display]
max_hz = 15                      # preview refresh; tkinter needs ~23 ms per 1280x360 image (measured)

[radar]                          # AWR2944PEVM + DCA1000EVM; processing code in ../estimation
cli_port = "COM4"                # XDS110 Class Application/User UART (Windows Device Manager)
estimation_dir = "../estimation"
cfg = "../estimation/config/awr2944_doa_perfect.cfg"
method = "infinirex_radar"            # Infini-Rex: 20 ms per frame at 32 chirps; CT-Rex OMP needs ~500 ms (measured)
gates = "range_angle"            # range gates: "range" (estimation: one summed profile) or "range_angle" (CFAR per beam; weak objects next to strong ones)
chirps = 32                      # first K chirps of every frame (128 recorded); fewer = faster
frames = 20                      # frames per take
range_tol_cells = 2              # a detection belongs to an object within 2 range cells and half a Rayleigh cell
r_min_m = 0.25                   # closer than 0.5 m is fine WITH the background take (leakage subtracted; tested: no false detections)
r_max_m = 1.1                    # close range (ball / board <= 1 m); 2.2 for the far experiments later
y_max_m = 0.45
min_rate = 0.5                   # an object counts if it is detected in at least half of the frames
window_frames = 10               # live radar: objects from the last 10 frames (1 s at 100 ms per frame)

[alignment]
hfov_deg = 70.0                  # start value only: the fit estimates the focal length
camera_centre_m = [-0.003, 0.0, 0.09]   # RULER: camera lens centre relative to the antenna centre (x fwd, y right, z up)
bar_z_m = [-0.38, 0.30]          # a radar detection is drawn as a vertical bar between these heights

[text]                           # any block writing (printed or handwritten), e.g. ARTIFACT
region_m = [0.45, 0.20]          # physical size of the area searched for text around the radar object (w, h)
centre_z_m = -0.05              # word centre 0.33 m above the table, antenna centre 0.38 m (2026-10-08)
mm_per_px = 1.5                  # MetricSight reader: resolution of the metric image
window_mm = 40.0                 # MetricSight reader: local-contrast window (~1.3 x letter height)
letter_mm = 30.0                 # letter height on the sheet: resolution check of read_text.py
read_hz = 8                      # live reads per second at most, ONE radar object each, in the reader process

[light]
source_size_m = 0.15             # lamp diameter: where clipped pixels are looked for around a radar object
refit_s = 1.0                    # the veil is refitted every second (the lamp does not move)
background_s = 2.0               # brightness model: memory of the per-pixel mean and variance
k_sigma = 5.0                    # a pixel is lit above mean + 5 standard deviations (Gaussian: 3e-7 per pixel)
off_s = 0.5                      # a light event ends after 0.5 s below the lamp's pixel area
